services:
  controlplane:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controlplane
    ports:
      - "5100:5100"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DATA_DIR=/data
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://localhost:5200/mcp}
    volumes:
      - controlplane-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  panel:
    build:
      context: ../apps/panel
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_CONTROLPLANE_URL=http://controlplane:5100
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

  mcp-server-default:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - CONTROLPLANE_URL=http://controlplane:5100
      - TRANSPORT=http
    ports:
      - "5200:5200"
    depends_on:
      controlplane:
        condition: service_healthy
    restart: unless-stopped

  # MCP de investigación. Servicio aparte, credenciales aparte, sin puerto público.
  #
  # No expone `ports:` a propósito: solo es alcanzable dentro de la red de compose.
  # Para acceso remoto, publica a través de un reverse proxy con IP allowlist DESPUÉS
  # de haber aplicado la Application Access Policy de Exchange (ver docs/INSIDER_TOOLS.md).
  mcp-insider:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.insider
    environment:
      - INSIDER_AZURE_TENANT_ID=${INSIDER_AZURE_TENANT_ID}
      - INSIDER_AZURE_CLIENT_ID=${INSIDER_AZURE_CLIENT_ID}
      - INSIDER_AZURE_CLIENT_SECRET=${INSIDER_AZURE_CLIENT_SECRET}
      - TRANSPORT=http
      - INSIDER_BIND=http://0.0.0.0:5300
      - INSIDER_KEYS=${INSIDER_KEYS}
      - INSIDER_APPROVER_TOKEN=${INSIDER_APPROVER_TOKEN}
      - INSIDER_ORG_DOMAINS=${INSIDER_ORG_DOMAINS}
      - INSIDER_TOOLS=${INSIDER_TOOLS:-off}
      - INSIDER_ALLOWED_IPS=${INSIDER_ALLOWED_IPS}
      - INSIDER_DB_PATH=/data/insider.db
      - INSIDER_EXPORT_DIR=/data/exports
    expose:
      - "5300"
    volumes:
      - insider-data:/data
    restart: unless-stopped

volumes:
  controlplane-data:
  insider-data:
