name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ZeroTeamsMcp.slnx

      - name: Build
        run: dotnet build ZeroTeamsMcp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test tests/ZeroTeamsMcp.Tests/ --configuration Release --verbosity normal

  panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/panel
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/panel/pnpm-lock.yaml

      - name: Install
        run: pnpm install

      - name: Build
        run: pnpm build
